name: Deploy IceMacha to AWS EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, bcmath, pdo_mysql

    - name: Install Composer Dependencies
      run: composer install --no-dev --optimize-autoloader

    - name: Install Node Dependencies & Build Assets
      run: |
        npm install
        npm run build

    - name: Pre-Deployment Permission Fix
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # Change ownership to ubuntu so scp-action can overwrite existing files
          sudo chown -R ubuntu:ubuntu /var/www/html

    - name: Deploy to EC2 via SSH
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "."
        target: "/var/www/html"
        rm: false 

    - name: Run Post-Deployment Commands
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd /var/www/html
          
          # 1. Database Setup (RDS)
          # Ensure you have run 'CREATE DATABASE icemacha_v2' manually in RDS first
          php artisan migrate --force
          php artisan db:seed --force
          
          # 2. Optimization
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          
          # 3. Storage & Permissions
          # Ensures product images are reachable by the web server
          php artisan storage:link || true
          
          # Set ownership back to www-data so Laravel can write logs/sessions
          sudo chown -R www-data:www-data /var/www/html/storage /var/www/html/bootstrap/cache
          sudo chmod -R 775 /var/www/html/storage /var/www/html/bootstrap/cache