name: Deploy IceMacha to AWS EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, bcmath, pdo_mysql

    - name: Install Composer Dependencies
      run: composer install --no-dev --optimize-autoloader

    - name: Install Node Dependencies & Build Assets
      run: |
        npm install
        npm run build

    - name: Deploy to EC2 via SSH
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "."
        target: "/var/www/html"
        rm: false # Set to true if you want to clear old files before syncing

    - name: Run Post-Deployment Commands
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd /var/www/html
          # 1. Update the RDS schema and plant the data
          php artisan migrate --force
          php artisan db:seed --force
          
          # 2. Clear and rebuild caches for performance
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          
          # 3. Ensure images are visible
          php artisan storage:link || true
          
          # 4. Fix folder permissions for the web server
          sudo chown -R ubuntu:www-data storage bootstrap/cache
          sudo chmod -R 775 storage bootstrap/cache