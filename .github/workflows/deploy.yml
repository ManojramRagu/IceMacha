name: Deploy IceMacha to AWS EC2 (Benchmark)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, bcmath, pdo_mysql

    - name: Install Composer Dependencies
      run: composer install --no-dev --optimize-autoloader

    - name: Install Node Dependencies & Build Assets
      run: |
        npm install
        npm run build

    - name: Pre-Deployment Permission Fix
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          sudo chown -R ubuntu:ubuntu /var/www/html
          sudo chmod 666 /var/www/html/storage/logs/laravel.log || true

    - name: Deploy to EC2 via SCP
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "."
        target: "/var/www/html"
        rm: false 

    - name: Run Post-Deployment Commands
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd /var/www/html
          php artisan migrate --force
          
          # Optimization
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          
          # Permissions
          php artisan storage:link || true
          sudo chown -R www-data:www-data /var/www/html/storage /var/www/html/bootstrap/cache
          sudo chmod -R 775 /var/www/html/storage /var/www/html/bootstrap/cache

    # --- THE PROFESSIONAL AWS CLI INVALIDATION ---
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-southeast-1

    - name: Invalidate CloudFront Cache
      run: |
        aws cloudfront create-invalidation \
          --distribution-id ${{ secrets.AWS_DISTRIBUTION_ID }} \
          --paths "/*"